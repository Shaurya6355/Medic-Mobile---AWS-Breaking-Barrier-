<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guideline to Form</title>
<style>
/* Layout idea: a reviewer's diff screen. Two dagre-laid decision flows (current left, new right) share node ids, so selecting one highlights its twin; below sit the rule detail, the patients whose outcome changes, and a sticky decision bar. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --ink:#14222A; --muted:#5A6A72; --line:#D2DBDF; --accent:#0B7A84;
  --chg:#B7791F; --chg-bg:#FDF3E1; --add:#2F855A; --add-bg:#E3F4EA; --del:#B23A2C; --del-bg:#FBE4E0;
  --pink:#E05A8A; --pink-bg:#FCE7EF; --yellow:#C9A100; --yellow-bg:#FFF6D6; --green:#2F8F5B; --green-bg:#E2F3E9;
  --font-display:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --font-body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
.app{max-width:1240px;margin:0 auto;padding:16px 16px 140px;display:grid;gap:16px}
.mock{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.mock b{font-family:var(--font-mono);font-weight:500;background:var(--surface);border:1px dashed var(--line);padding:1px 6px;border-radius:4px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end}
.crumb{font-size:12px;color:var(--muted)}
h1{font-family:var(--font-display);font-size:24px;margin:2px 0 0;line-height:1.25;text-wrap:balance}
h2{font-family:var(--font-display);font-size:15px;margin:0;font-weight:600}
.risk{display:inline-flex;gap:8px;align-items:center;background:var(--pink-bg);color:var(--ink);border:1px solid var(--pink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.risk i{width:8px;height:8px;border-radius:50%;background:var(--pink);display:inline-block}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.chk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;border-left:4px solid var(--green)}
.chk.warn{border-left-color:var(--chg)}
.chk .k{font-size:12px;color:var(--muted)}
.chk .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;border:2px solid}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0;display:grid;gap:8px;align-content:start}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ver{font-size:12px;color:var(--muted)}
.ver code{font-family:var(--font-mono);font-size:11px}
.tagcur,.tagnew{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.tagcur{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.tagnew{background:var(--chg-bg);color:var(--chg);border:1px solid var(--chg)}
.stage{position:relative;overflow:hidden}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.canvas svg{position:absolute;left:0;top:0;overflow:visible}
.edge{fill:none;stroke:var(--muted);stroke-width:1.4}
.elbl rect{fill:var(--surface)}
.elbl text{font-size:11px;fill:var(--muted);font-family:var(--font-body)}
.ah{fill:var(--muted)}
.node{position:absolute;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13px;line-height:18px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;transition:opacity .15s, box-shadow .15s}
.node:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.node .kick{font-size:11px;line-height:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:flex;justify-content:space-between;gap:6px}
.node .sub{font-size:12px;line-height:16px;color:var(--muted);margin-top:2px}
.node.decision{border-radius:14px}
.node.start{background:var(--bg)}
.node.outcome{border-top-width:6px}
.node.o-pink{border-top-color:var(--pink)} .node.o-yellow{border-top-color:var(--yellow)} .node.o-green{border-top-color:var(--green)}
.node.outcome .ttl{font-weight:700;font-size:12px;letter-spacing:.02em}
.node.task{border-style:dashed}
.node.d-changed{border-color:var(--chg);background:var(--chg-bg)}
.node.d-added{border-color:var(--add);background:var(--add-bg)}
.node.d-removed{border-color:var(--del);background:var(--del-bg)}
.badge{font-size:10px;font-weight:700;padding:0 6px;border-radius:999px;letter-spacing:.04em}
.badge.changed{background:var(--chg);color:var(--surface)}
del{color:var(--del);text-decoration-thickness:2px}
ins{color:var(--add);text-decoration:none;font-weight:600;border-bottom:2px solid var(--add)}
.node.sel{box-shadow:0 0 0 3px var(--accent)}
.dimmed .node:not(.d-changed):not(.d-added):not(.d-removed):not(.sel){opacity:.35}
.lower{display:grid;grid-template-columns:5fr 7fr;gap:16px}
@media (max-width:860px){.lower{grid-template-columns:1fr}}
.rule{display:grid;gap:10px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
.side{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px;align-content:start}
.side .lab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.quote{font-size:13px;border-left:3px solid var(--line);padding-left:8px;color:var(--muted)}
.quote small{display:block;font-size:11px}
.bound{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.chip.y{border-color:var(--yellow);background:var(--yellow-bg)}
.chip.n{border-color:var(--green);background:var(--green-bg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
td:nth-child(-n+3),td .btn{white-space:nowrap}
.cls{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cls i{width:8px;height:8px;border-radius:2px;display:inline-block}
.arrow{color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar .who{font-size:12px;color:var(--muted)}
.bar .who b{color:var(--ink)}
.bar .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar label{font-size:12px;color:var(--muted)}
.bar input[type=text]{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:240px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:12px;color:var(--accent);width:100%}
.tabs{justify-self:start;display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;gap:2px}
.tabs button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.banner{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--chg);border-radius:10px;padding:10px 12px;font-size:13px}
.picker{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.picker button{font:inherit;font-size:12px;font-family:var(--font-mono);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.picker button.dif{border-color:var(--chg)}
.picker button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.picker button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{width:100%;max-width:340px;margin:0 auto;border:10px solid var(--ink);border-radius:30px;background:var(--surface);overflow:hidden}
.phone .bar2{background:var(--accent);color:var(--surface);padding:10px 14px;font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.phone .bar2 span{font-weight:400;font-size:12px;opacity:.85}
.fq{padding:10px 14px;border-bottom:1px solid var(--line);display:grid;gap:6px;font-size:13px}
.fq .lb{font-weight:600}
.fq .hint{font-size:12px;color:var(--muted);margin-top:-4px}
.fin{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums;background:var(--bg)}
.opt{display:flex;gap:8px;align-items:center}
.rd,.cb{width:14px;height:14px;border:1.5px solid var(--muted);flex:none}
.rd{border-radius:50%}.cb{border-radius:3px}
.rd.on,.cb.on{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
.sect{padding:8px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--bg)}
.res{margin:10px 14px;border-radius:8px;padding:10px;border:1px solid var(--line);border-top-width:6px;display:grid;gap:4px;font-size:13px}
.res.o1{border-top-color:var(--pink);background:var(--pink-bg)}.res.o2{border-top-color:var(--yellow);background:var(--yellow-bg)}.res.o3{border-top-color:var(--green);background:var(--green-bg)}
.res.diff{outline:3px solid var(--chg);outline-offset:2px}
.res b{font-size:12px;letter-spacing:.02em}
.submit{margin:6px 14px 14px;text-align:center;background:var(--accent);color:var(--surface);border-radius:8px;padding:8px;font-weight:600;font-size:13px}
.pipe{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.pipe .st{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:grid}
.pipe .st b{font-size:13px}
.pipe .st span{color:var(--muted)}
.pipe .st.ours{border-color:var(--accent)}
.pipe .ar{color:var(--muted)}
.xls{font-family:var(--font-mono);font-size:12px}
.xls td,.xls th{white-space:nowrap;padding:5px 8px}
.xls td:nth-child(n+4){white-space:normal;min-width:180px}
.xls tr.del td{background:var(--del-bg)}
.xls tr.add td{background:var(--add-bg)}
.xls td.m{font-weight:700;width:14px}
.xls tr.del td.m{color:var(--del)}.xls tr.add td.m{color:var(--add)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:980px){.three{grid-template-columns:1fr}}
pre.code{margin:0;font-family:var(--font-mono);font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
pre.code .d{color:var(--del);background:var(--del-bg);display:block}
pre.code .a{color:var(--add);background:var(--add-bg);display:block}
pre.code .c{color:var(--muted);display:block}
@media (prefers-reduced-motion: reduce){.node{transition:none}}
.stepper{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stp{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer}
.stp:disabled{cursor:not-allowed;color:var(--muted);opacity:.7}
.stp .dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--line)}
.stp.now{border-color:var(--accent);font-weight:600}
.stp.now .dot{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.stp.done .dot{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.stp.next{cursor:default;border-style:dashed;color:var(--muted)}
.stp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.who2{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.pcard{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--bg)}
.pcard code{font-family:var(--font-mono);font-size:11px}
.kinds{display:grid;gap:8px}
.kind{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);cursor:pointer}
.kind > span:last-child{display:grid;gap:2px}
.kind.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.kind .rd{margin-top:3px}
.kind:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.file > span:last-child{display:grid}
.pdf{font-family:var(--font-mono);font-size:11px;font-weight:600;background:var(--del-bg);color:var(--del);border-radius:4px;padding:6px 6px}
.checklist{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
.checklist li{padding-left:22px;position:relative}
.checklist li.ok::before{content:"✓";position:absolute;left:4px;color:var(--green);font-weight:700}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pg{font:inherit;display:grid;gap:4px;justify-items:start;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.pg .lines{display:grid;gap:3px;width:100%}
.pg .lines i{display:block;height:4px;border-radius:2px;background:var(--line)}
.pg .lines i:nth-child(2n){width:70%}
.pg .pn{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.pg .pt{font-size:11px;line-height:1.3}
.pg.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn:disabled{opacity:.5;cursor:not-allowed}
a.btn{text-decoration:none;justify-self:start;display:inline-block}
.chk.bad{border-left-color:var(--del)}
.chk.muted{border-left-color:var(--line)}
.rcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;cursor:pointer;background:var(--surface)}
.rcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.rhead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rid{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge.ai{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.ed{background:var(--accent);color:var(--surface)}
.rbody{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.rbody select,.dform select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.kw{color:var(--muted);font-size:12px;font-weight:600}
.out{font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px;border-left:4px solid}
.out.o-o1{background:var(--pink-bg);border-color:var(--pink)}.out.o-o2{background:var(--yellow-bg);border-color:var(--yellow)}.out.o-o3{background:var(--green-bg);border-color:var(--green)}
.was{font-size:12px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.page{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;background:var(--bg)}
.page .pl{height:7px;border-radius:3px;background:var(--line)}
.page .pl.s{width:60%}
.page .hl{background:var(--yellow-bg);border:1px solid var(--yellow);border-radius:4px;padding:6px 8px;font-size:13px;font-weight:600}
.issue{border:1px solid var(--line);border-left:4px solid var(--del);border-radius:8px;padding:10px;display:grid;gap:6px}
.issue.warning{border-left-color:var(--chg)}
.issue.done{border-left-color:var(--green);opacity:.85}
.ih{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ih b{flex:1;font-size:13px}
.sev{font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--del)}
.issue.warning .sev{color:var(--chg)}.issue.done .sev{color:var(--green)}
.dform{display:flex;flex-wrap:wrap;gap:6px}
.dform input{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);flex:1;min-width:140px}
.dec{font-size:13px;color:var(--green);font-weight:600}
.summary{display:grid;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.summary > div{display:grid;grid-template-columns:110px 1fr;gap:8px}
.summary .k{color:var(--muted)}
.summary code{font-family:var(--font-mono);font-size:11px}
.lab2{font-size:12px;font-weight:600;color:var(--muted)}
select#rev,textarea{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
textarea{resize:vertical}
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:0}
.timeline li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:13px;color:var(--muted);position:relative}
.timeline li::before{content:"";position:absolute;left:10px;top:30px;bottom:-8px;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.tdot{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700;z-index:1}
.timeline li.done{color:var(--ink)}
.timeline li.done .tdot{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.timeline li.now{color:var(--ink);font-weight:600}
.timeline li.now .tdot{border-color:var(--accent)}

.editgrid{display:grid;grid-template-columns:7fr 5fr;gap:16px;align-items:start}
@media (max-width:960px){.editgrid{grid-template-columns:1fr}}
.rightcol{display:grid;gap:16px;align-content:start}
.editor{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.fld{display:grid;gap:4px;border:0;margin:0;padding:0;min-width:0}
.fld label,.fld legend{font-size:12px;font-weight:600;color:var(--muted);padding:0}
.fld input[type=text],.fld input[type=number],.fld textarea{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.fld input[type=number]{font-variant-numeric:tabular-nums}

function suggest(m, id, fb){
  const note = (fb.note || "").trim(), val = (fb.value || "").trim(), lower = (note + " " + val).toLowerCase();
  const clar = (t) => ({kind:"clarify", text:t});
  if (!val && note.length < 25) return clar("Needs clarification: the note does not say what to change. Ask the clinician for the exact wording or value, or edit it yourself.");
  const isQ = id.startsWith("q:"), q = isQ ? id.slice(2) : null;
  const mk = (field, from, to, apply) => ({kind:"change", field, from:String(from), to:String(to), apply});
  if (isQ && !m.questions[q]) return clar("This question is not in v4. Restore it first, then apply the change.");
  if (fb.type === "wording"){
    if (!val) return clar("Needs clarification: no new wording was given.");
    if (isQ) return mk("Question label", m.questions[q].label, val, x => { x.questions[q].label = val; });
    if (["d1","d2","d3"].includes(id)) return mk("Question", m[id].q, val, x => { x[id].q = val; });
    if (id[0] === "o") return /name|title|classif/.test(note.toLowerCase()) ? mk("Classification name", m[id].title, val, x => { x[id].title = val; }) : mk("Note shown to the CHW", m[id].note, val, x => { x[id].note = val; });
    if (id === "f1") return mk("Task title", m.f1.title, val, x => { x.f1.title = val; });
    return clar("Wording does not apply to this box. Say what should change.");
  }
  if (fb.type === "value"){
    const num = parseFloat(val.replace(/[^\d.]/g, ""));
    if ((id === "d2" || id === "d3") && isNaN(num) && /indrawing|stridor|fast/.test(lower)){
      const key = /indrawing/.test(lower) ? "ci" : /stridor/.test(lower) ? "stridor" : "fast";
      const rem = /remove|drop|\bnot\b|without|shouldn/.test(lower);
      const next = rem ? m[id].conds.filter(c => c !== key) : Array.from(new Set(m[id].conds.concat(key)));
      return mk("Yes if any of", m[id].conds.map(c => COND[c]).join(", "), next.map(c => COND[c]).join(", "), x => { x[id].conds = next; });
    }
    if (isNaN(num)) return clar("Needs clarification: no number was given.");
    if (id === "d3"){
      const f = /cut-?off|age/.test(note.toLowerCase()) ? "cut" : /older|over|after/.test(lower) ? "old" : "young";
      return mk({cut:"Age cut-off (months)", young:"Threshold under the cut-off (/min)", old:"Threshold at or over the cut-off (/min)"}[f], m.d3[f], num, x => { x.d3[f] = num; });
    }
    if (id === "f1"){ const f = /open|until|end|close/.test(lower) ? "end" : "due"; return mk(f === "due" ? "Due on day" : "Open until day", m.f1[f], num, x => { x.f1[f] = num; }); }
    if (id === "start"){ const f = /youngest|from|min/.test(lower) ? "ageMin" : "ageMax"; return mk(f === "ageMin" ? "Youngest age (months)" : "Up to age (months)", m.start[f], num, x => { x.start[f] = num; }); }
    return clar("This box has no numeric value. Say which value should change.");
  }
  if (fb.type === "show"){
    if (!val) return clar("Needs clarification: give the new show condition, for example cough = yes.");
    const target = isQ ? q : (usesOf(m, id).find(k => lower.includes(k.replace("_", " "))) || usesOf(m, id)[0]);
    if (!target) return clar("Show conditions belong to questions. Pick the question.");
    return mk("Shown when (" + target + ")", m.questions[target].showIf || "always", val, x => { x.questions[target].showIf = val; });
  }
  if (fb.type === "source"){
    if (!val) return clar("Needs clarification: say which passage to cite instead.");
    if (isQ) return mk("Cited quote", m.questions[q].quote, val, x => { x.questions[q].quote = val; });
    if (!m.src[id]) return clar("This box has no citation.");
    return mk("Cited quote", m.src[id][0], val, x => { x.src[id] = [val, m.src[id][1]]; });
  }
  if (fb.type === "remove"){
    if (isQ) return mk("Question " + q, m.questions[q].label, "(removed)", x => { delete x.questions[q]; });
    return clar("Removing a whole step changes the decision table. Ask what should replace it.");
  }
  const label = val || note;
  const key = label.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "").slice(0, 24) || "new_question";
  return mk("New question " + key, "(none)", label, x => { x.questions[key] = {type:"yesno", label, showIf:"cough = yes", quote:"From clinician feedback; no guideline quote yet"}; });
}

const STAGES = [
  {key:"none", label:"Pick guideline pages", owner:"po", screen:"guidelines"},
  {key:"po_draft", label:"Check & edit draft", owner:"po", screen:"review"},
  {key:"clinician", label:"Clinical review", owner:"clinician", screen:"review"},

function gate(w, checks){
  const blockIds = Array.from(new Set(checks.filter(c => c[0] === "blocking").map(c => c[1])));
  const poFlags = w.flags.filter(f => !f.clinical && !f.res);
  const clinFlags = w.flags.filter(f => f.clinical && !f.res);
  const changesNow = Object.keys(w.reviews).filter(k => w.reviews[k].status === "changes" && w.reviews[k].round === w.round);
  const unresolved = changesNow.filter(id => !(w.sug[id] && (w.sug[id].outcome === "accepted" || w.sug[id].outcome === "edited")) && !w.fixed[id]);
  const reqLeft = w.required.filter(id => !(w.reviews[id] && w.reviews[id].round === w.round));

    returnToPO:() => setW(x => {
      const sug = {}; let k = 0, c = 0;
      Object.keys(x.reviews).forEach(id => { const r = x.reviews[id]; if (r.status === "changes" && r.round === x.round){ sug[id] = suggest(x.model, id, r); if (sug[id].kind === "change") k++; else c++; } });
      let y = Object.assign({}, x, {state:"po_revise", sug, fixed:{}, rev:0, lastKey:null});
      y = logged(y, "Clinician", "Returned to PO with feedback (round " + x.round + ")", Object.keys(sug).length + " change requests");
      return logged(y, "System", "AI revisions drafted from feedback", k + " proposed, " + c + " need clarification"); }),
    sug:(id, outcome) => setW(x => {
      const s = x.sug[id]; let y = Object.assign({}, x, {sug:Object.assign({}, x.sug, {[id]:Object.assign({}, s, {outcome})})});
      if ((outcome === "accepted" || outcome === "edited") && s.kind === "change"){
        const m = clone(x.model); s.apply(m);
        y = Object.assign(y, {model:m, hist:x.hist.concat([x.model]), rev:x.rev + 1, lastKey:null});
        y = addVersion(y, outcome === "accepted" ? "AI revision accepted (" + id + ")" : "AI revision applied, then edited (" + id + ")", "Program officer");
      }
      if (outcome === "accepted") nextAfter(y, id);
      return logged(y, "Program officer", (outcome === "accepted" ? "Accepted" : outcome === "edited" ? "Applied and editing" : "Discarded") + " AI revision on " + id, s.kind === "change" ? s.field + ": " + s.to : s.text); }),
    approveAll:() => setW(x => {
      setTimeout(() => go("release"), 0);
      let y = Object.assign({}, x, {state:"verify", approved:{ver:"v4." + x.round, hash:fnv(JSON.stringify(x.model)), round:x.round}});
      y = addVersion(y, "Approved by clinician", "Clinician");
      return logged(y, "Clinician", "Approved all (round " + x.round + ")", "Approval bound to " + y.approved.hash); }),
    runVerify:() => setW(x => {
      const m = x.model, mut = clone(m); mut.d3.young += 1;
      const v = {match:GRID.length, cov:new Set(GRID.map(p => classify(m, p).rule).filter(r => r !== "start")).size, tasks:GRID.filter(p => classify(m, p).out === "o2").length, mut:GRID.filter(p => classify(mut, p).out !== classify(m, p).out).length};
      let y = Object.assign({}, x, {verify:v, state:"deploy"});
      y = logged(y, "System", "cht-conf build passed; synthetic check passed", v.match + "/" + GRID.length + " match · mutation caught " + v.mut);
      return logged(y, "System", "Sent to IT approver", ""); }),
    setRole:(r, scr) => { setRole(r); go(scr); },
    reset:() => reset(),
    approveDeploy:() => setW(x => logged(Object.assign({}, x, {state:"done"}), "IT approver", "Approved deploy", "Upload to CHT test instance; rollback target v3 " + V3_HASH))
  };
  const reset = () => { setW(initialWf()); setSel("d3"); location.hash = "guidelines"; };
  const n = nextStep(w, role, checks, screen, act, go, pick);
  const actionScreen = n.mine ? STAGES.find(s => s.key === w.state).screen : null;
  const stateText = {none:"No workflow", po_draft:"Draft · program officer", clinician:"With clinician · round " + w.round, po_revise:"Revising · program officer", verify:"Approved · verify next", deploy:"Waiting for IT", done:"Deployed"}[w.state];
  return h(React.Fragment, null,
    h("header", {className:"apphead"},
      h("div", {className:"hin"},
        h("span", {className:"brand"}, "Guideline to Form"),
        h("nav", {className:"nav", "aria-label":"Screens"}, SCREENS.map(([k, l]) => h("a", {key:k, href:"#" + k, className:(screen === k ? "on" : "") + (actionScreen === k ? " act" : ""), "aria-current":screen === k ? "page" : null}, l, actionScreen === k ? h("span", {className:"ndot", "aria-label":"your next step is here"}) : null))),
        h("label", {className:"nx-who", htmlFor:"role"}, "Viewing as",
          h("select", {id:"role", value:role, onChange:e => setRole(e.target.value)}, ROLES.map(([k, l]) => h("option", {key:k, value:k}, l)))))),
    h(NextStrip, {w, n, role, pick}),
    h("main", {className:"app"},
      screen === "guidelines" ? h(GuidelinesScreen, {w, role, act}) : null,
      screen === "review" ? h(ReviewScreen, {w, role, sel, setSel, act, checks}) : null,
      screen === "compare" ? h(CompareScreen, {w}) : null,
      screen === "release" ? h(ReleaseScreen, {w, role, act}) : null,
      screen === "history" ? h(HistoryScreen, {w, act}) : null,
      h("div", {className:"foot"}, h("span", null, "Mock-up. Example data based on the WHO IMCI 2008 to 2014 revision. Not clinical advice."), h("span", null, "\u201cViewing as\u201d stands in for three separate logins."))));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();

</script>
