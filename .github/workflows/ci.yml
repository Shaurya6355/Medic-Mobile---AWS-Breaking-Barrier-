name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  agentservice:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AgentService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            AgentService/package-lock.json
            Backend/package-lock.json
      - run: npm ci
        working-directory: Backend
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Infra/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx cdk synth
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: us-west-2
      - run: npx cdk synth -c modelBackend=agentcore
        env:
          CDK_DEFAULT_ACCOUNT: "111111111111"
          CDK_DEFAULT_REGION: us-west-2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: Backend
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      # Exercises the Lambda Web Adapter COPY in the lambda stage.
      - uses: docker/build-push-action@v6
        with:
          context: Backend
          target: lambda
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=lambda
          cache-to: type=gha,mode=max,scope=lambda
      # AgentCore Runtime requires an ARM64 image.
      - uses: docker/build-push-action@v6
        with:
          context: AgentService
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=agentservice
          cache-to: type=gha,mode=max,scope=agentservice
